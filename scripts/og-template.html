<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
      }

      body {
        background: #ffffff;
        color: #0a0a0a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC',
          'PingFang SC', 'Microsoft YaHei', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        position: relative;
        overflow: hidden;
      }

      /* 与站点同款的 64px 网格，放射状渐隐 */
      .grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(
            to right,
            rgba(10, 10, 10, 0.06) 1px,
            transparent 1px
          ),
          linear-gradient(to bottom, rgba(10, 10, 10, 0.06) 1px, transparent 1px);
        background-size: 64px 64px;
        -webkit-mask-image: radial-gradient(115% 85% at 30% 0%, #000 15%, transparent 74%);
        mask-image: radial-gradient(115% 85% at 30% 0%, #000 15%, transparent 74%);
      }

      .inner {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        justify-content: space-between;
      }

      .top {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 26px;
        font-weight: 660;
        letter-spacing: -0.01em;
      }

      .mark {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        background: #0a0a0a;
      }

      .main {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .kicker {
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #737373;
      }

      .title {
        font-size: 66px;
        font-weight: 660;
        line-height: 1.14;
        letter-spacing: -0.022em;
        max-width: 940px;
      }

      .desc {
        font-size: 26px;
        color: #525252;
        line-height: 1.5;
        max-width: 880px;
      }

      .footer {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 20px;
        color: #737373;
        padding-top: 28px;
        border-top: 1px solid #e5e5e5;
      }

      .url {
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="inner">
      <div class="top">
        <span class="mark"></span>
        <span>慕</span>
      </div>

      <div class="main">
        <div class="kicker">{{KICKER}}</div>
        <div class="title">{{TITLE}}</div>
        <div class="desc">{{DESC}}</div>
      </div>

      <div class="footer">
        <span class="url">xaviermu.github.io</span>
        <span>记录折腾电脑和手机的过程</span>
      </div>
    </div>
  </body>
</html>
